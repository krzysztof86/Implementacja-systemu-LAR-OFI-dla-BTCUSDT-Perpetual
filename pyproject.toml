[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lar-ofi"
version = "0.1.0"
description = "LAR-OFI: semi-automatic, auditable market-state analysis for Bybit BTCUSDT Perpetual (screenshot mode + optional L2). No order execution."
requires-python = ">=3.11"
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lar-ofi = "lar_ofi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lar_ofi = ["default_config.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
